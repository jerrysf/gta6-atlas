      <!-- south express to Grassrivers -->
      <path d="M 16600 12200 C 16000 13200 15200 14100 14400 14800 C 13800 15300 13200 15700 12700 16100"/>
      <!-- keys causeway hwy -->
      <path d="M 12700 16100 C 12000 16700 11400 17050 10850 17250"/>
      <!-- west highway -->
