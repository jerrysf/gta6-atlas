  </g>
  <use href="#landShape" fill="none" stroke="#7fd0e8" stroke-width="260" opacity="0.5" filter="url(#soft)"/>
  <use href="#keyShape1" fill="none" stroke="#7fd0e8" stroke-width="200" opacity="0.4" filter="url(#soft)"/>
  <use href="#keyShape2" fill="none" stroke="#7fd0e8" stroke-width="160" opacity="0.4" filter="url(#soft)"/>
  <use href="#keyShape3" fill="none" stroke="#7fd0e8" stroke-width="160" opacity="0.4" filter="url(#soft)"/>
  <use href="#beach1" fill="none" stroke="#7fd0e8" stroke-width="180" opacity="0.4" filter="url(#soft)"/>
  <use href="#beach2" fill="none" stroke="#7fd0e8" stroke-width="160" opacity="0.4" filter="url(#soft)"/>
  <!-- graticule -->
  <g stroke="#0a2c4e" stroke-width="3" opacity="0.5">
