    <path id="beach2" d="M 19900 11800 C 20150 11750 20350 11850 20400 12050 C 20450 12300 20300 12650 20050 12900 C 19850 13100 19700 13150 19650 12950 C 19600 12750 19700 12400 19800 12200 C 19850 12050 19850 11850 19900 11800 Z"/>
