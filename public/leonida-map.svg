      <path d="M 14200 10000 C 14000 9000 13900 8000 14000 7000 C 14100 5900 13900 4900 13400 4100" stroke-dasharray="60 90"/>
      <path d="M 16600 12200 C 16000 13200 15200 14100 14400 14800 C 13800 15300 13200 15700 12700 16100" stroke-dasharray="60 90"/>
