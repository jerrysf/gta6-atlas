    C 13000 2450 14300 2600 15000 2950
    C 15600 3250 15700 3800 15100 4350
    C 14400 4950 13300 5300 12000 5450
    C 10600 5600 9300 5450 8400 4950
    C 7600 4500 7200 3900 7350 3350
    C 7450 3000 7550 2750 7800 2600 Z"/>
