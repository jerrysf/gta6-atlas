  <use href="#beach2" fill="#e8e2cc" stroke="#c9c2a8" stroke-width="18"/>
  <use href="#islandNE" fill="#9ec47a" stroke="#cfe4b8" stroke-width="16"/>
  <use href="#keyShape1" fill="#8fb86a" stroke="#d8ecc8" stroke-width="22"/>
  <use href="#keyShape2" fill="#8fb86a" stroke="#d8ecc8" stroke-width="18"/>
