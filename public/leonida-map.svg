      C 19600 11700 19550 12200 19500 12600
      C 19350 13050 19050 13350 18650 13500
      C 18100 13700 17450 13600 17000 13300
      C 16550 13000 16300 12450 16250 11850
      C 16200 11200 16350 10500 16450 9900
