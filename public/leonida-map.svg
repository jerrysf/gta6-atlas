  <!-- ══ COMPASS ══ -->
  <g transform="translate(19400 18500)" opacity="0.85">
    <circle r="620" fill="#0e3358" opacity="0.5"/>
    <path d="M0,-560 L120,0 L0,560 L-120,0 Z" fill="#e8f0f8"/>
    <path d="M0,-560 L120,0 L0,0 Z" fill="#b6f34a"/>
    <path d="M0,-560 L-120,0 L0,0 Z" fill="#9aa8b8"/>
    <text y="-720" font-family="Arial,sans-serif" font-weight="800" font-size="260" fill="#e8f0f8" text-anchor="middle">N</text>
    <text x="720" y="90" font-family="Arial,sans-serif" font-weight="700" font-size="180" fill="#b8c8d8" text-anchor="middle">E</text>
    <text x="-720" y="90" font-family="Arial,sans-serif" font-weight="700" font-size="180" fill="#b8c8d8" text-anchor="middle">W</text>
    <text y="800" font-family="Arial,sans-serif" font-weight="700" font-size="180" fill="#b8c8d8" text-anchor="middle">S</text>
