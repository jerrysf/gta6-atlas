      <path d="M 14000 7000 C 13200 6600 12400 6600 11800 6900"/>
      <path d="M 16400 9800 C 15800 10600 15200 11200 14400 11500 C 13800 11700 13200 11700 12600 11600"/>
      <path d="M 12000 11700 C 11600 12600 11400 13500 11500 14300 C 11600 15000 12000 15600 12700 16100"/>
    </g>
  </g>

  <!-- ══ LABELS ══ -->
  <g font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="700" letter-spacing="60" text-anchor="middle" fill="#ffffff" style="paint-order:stroke" stroke="#1a3a55" stroke-width="14">
    <text x="11500" y="4050" font-size="430" opacity="0.92">MOUNT KALAGA N.P.</text>
    <text x="10850" y="5850" font-size="330" opacity="0.9">PORT GELLHORN</text>
    <text x="12600" y="8500" font-size="360" opacity="0.9">AMBROSIA</text>
    <text x="18300" y="11250" font-size="380" opacity="0.95" letter-spacing="80">VICE CITY</text>
    <text x="13000" y="15700" font-size="360" opacity="0.9">GRASSRIVERS</text>
    <text x="10000" y="18950" font-size="330" opacity="0.9">LEONIDA KEYS</text>
    <text x="20350" y="10100" font-size="240" opacity="0.85" transform="rotate(78 20350 10100)" letter-spacing="40">VICE BEACH</text>
