    <path id="keyShape2" d="M 11800 17200 C 12300 17150 12800 17200 13100 17350 C 13300 17450 13250 17600 12950 17680 C 12550 17780 12000 17700 11800 17550 C 11700 17450 11700 17300 11800 17200 Z"/>
    <path id="keyShape3" d="M 7800 17650 C 8200 17550 8600 17550 8800 17680 C 8900 17800 8800 17920 8600 17980 C 8300 18080 7900 17950 7800 17800 C 7740 17730 7740 17690 7800 17650 Z"/>
