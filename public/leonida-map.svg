      C 19700 9800 19550 10350 19500 10800
      C 19450 11350 19550 11900 19700 12400
      C 19850 12900 19900 13450 19700 13900
      C 19500 14350 19100 14650 18650 14800
      C 18050 15000 17400 15050 16900 15250
